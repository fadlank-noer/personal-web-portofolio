services:
  web:
    build:
      context: ../..
      dockerfile: deployments/local-development/Dockerfile.multi
    image: web-portofolio:local
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
