server {
    listen 80;
    server_name _;

    # Emit RELATIVE redirects (e.g. Location: /library/ instead of the absolute
    # http://localhost/library/). A relative Location is resolved by the browser
    # against the current origin, so a site served on a mapped port like
    # localhost:3000 keeps that port and never drops to localhost:80
    # (which would cause ERR_CONNECTION_REFUSED).
    absolute_redirect off;
    port_in_redirect off;
    server_name_in_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # ── SPA routing ──────────────────────────────────────────────────────────
    # Cloudflare Pages / any CDN expects index.html for all non-file routes.
    # This config mirrors that behavior: if no file matches, serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache headers (static assets) ────────────────────────────────────────
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Assets dir (css, js chunks from Vite build output)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # CV / library sub-assets
    location /cv/ {
        expires 1h;
        add_header Cache-Control "public";
    }

    location /library/ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # ── No-cache paths ────────────────────────────────────────────────────────
    location ~ ^/(api|__data) {
        return 404;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json
               application/xml application/xml+rss;

    # ── Health check endpoint (used by HEALTHCHECK in Dockerfile) ─────────────
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}