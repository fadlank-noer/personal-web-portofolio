name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build project
        env:
          # Prebuild (scripts/prebuild.mjs) fetches Substack posts before the
          # static build. .env is gitignored, so CI gets these from repo
          # secrets; the fallbacks match the local .env defaults.
          SUBSTACK_PUBLICATION_URL: ${{ secrets.SUBSTACK_PUBLICATION_URL || 'https://fadlansthought.substack.com/' }}
          SUBSTACK_LIMIT: ${{ secrets.SUBSTACK_LIMIT || '10' }}
          SUBSTACK_SORT: ${{ secrets.SUBSTACK_SORT || 'new' }}
          # GitHub Actions runner IPs are 403-challenged by Substack's
          # Cloudflare on direct fetches, so route through the Pages Function
          # proxy of the astro-substack-static test site (needs
          # astro-substack >= 0.2.0 for the proxyBaseUrl option).
          SUBSTACK_PROXY_URL: https://astro-substack-static.pages.dev/api/archive
        run: npm run build

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages project create personal-web-portofolio --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=personal-web-portofolio